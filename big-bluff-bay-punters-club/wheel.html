<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Spin the Wheel • Big Bluff Bay</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="wrap" style="padding:1rem 0 2rem">
    <section class="card">
      <h1>🎡 Spin the Wheel</h1>
      <p class="muted" id="wheel-prize">Loading prize…</p>
      <div style="display:grid;place-items:center;gap:.8rem">
        <div style="position:relative;width:min(92vw,640px);aspect-ratio:1/1">
          <canvas id="wheel-canvas" width="640" height="640" style="width:100%;height:100%"></canvas>
          <div style="position:absolute;left:50%;top:-8px;transform:translateX(-50%);font-size:2rem">▼</div>
        </div>
        <button id="wheel-spin-btn" class="btn">Spin</button>
        <p id="wheel-status" class="muted" aria-live="polite">Ready.</p>
      </div>
    </section>

    <section class="card" id="wheel-result-card" hidden>
      <h2>Winner</h2>
      <p id="wheel-winner" style="font-size:1.2rem;font-weight:700"></p>
      <p id="wheel-result-prize" class="muted"></p>
      <p id="wheel-fairness" class="muted" style="font-size:.9rem"></p>
    </section>
  </main>
  <script src="/wheel.js?v=20260224-2"></script>
</body>
</html>
