<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Punters Club Round Results • Big Bluff Bay</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="wrap">
    <h1>Round Results Archive</h1>
    <p class="muted" id="results-round-label">Loading round…</p>
    <section class="card">
      <h2>Final Leaderboard</h2>
      <div class="table-wrap"><table><thead><tr><th>Rank</th><th>Punter</th><th>Points</th></tr></thead><tbody id="results-ladder"><tr><td colspan="3" class="muted">Loading…</td></tr></tbody></table></div>
    </section>
    <section class="card">
      <h2>Final Fixtures</h2>
      <div id="results-fixtures" class="grid three"></div>
    </section>
    <section class="card">
      <h2>This week’s tips feed</h2>
      <div id="results-tips" class="grid three"></div>
    </section>
  </main>
  <script defer src="/punters-results.js"></script>
</body>
</html>
