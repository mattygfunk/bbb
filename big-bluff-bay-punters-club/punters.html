<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Punters Area • Big Bluff Bay</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero"><div class="overlay"></div><nav class="nav wrap"><div class="brand"><span class="badge">BBB</span><span><strong>Punters Area</strong><small>Big Bluff Bay</small></span></div><div class="menu-links"><a class="menu-link" href="/">Home</a><a class="menu-link active" href="/punters.html">Punters</a><a class="menu-link" href="/admin.html">Admin</a></div><div id="auth-controls"></div></nav></header>
    <main class="wrap">
      <section class="card"><h2>Upcoming Fixtures</h2><div class="grid three" id="fixtures-list"></div></section>
      <section class="card"><h2>Community Tips <span class="pill" id="tips-count">0</span></h2><div class="grid three" id="tips-list"></div></section>
      <section class="card"><h2>Member Login</h2>
        <form id="login-form" class="stack">
          <label>Member <input required name="member" type="text" /></label>
          <label>Password <input required name="pin" type="password" /></label>
          <div class="row-actions"><button class="btn" type="submit" data-mode="login">Log In</button><button class="btn btn-ghost" type="submit" data-mode="register">Register</button></div>
        </form>
        <p id="login-msg" class="muted"></p>
      </section>
