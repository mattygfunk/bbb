<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Big Bluff Bay Punters Club</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <div class="overlay"></div>
      <nav class="nav wrap">
        <div class="brand">
          <span class="badge">BBB</span>
          <span><strong>Big Bluff Bay</strong><small>Punters Club</small></span>
        </div>
        <div class="menu-links">
          <a class="menu-link active" href="/">Home</a>
          <a class="menu-link" href="/punters.html">Punters</a>
          <a class="menu-link" href="/admin.html">Admin</a>
        </div>
      </nav>
    </header>

    <main class="wrap home-grid">
      <section class="card">
        <h2>Punters Login</h2>
        <form id="home-login-form" class="stack">
          <label>Member <input required name="member" type="text" placeholder="your username" autocomplete="username" /></label>
          <label>Password <input required name="pin" type="password" placeholder="your password" autocomplete="current-password" /></label>
          <div class="row-actions">
            <button class="btn" type="submit" data-mode="login">Log In to Punters</button>
            <button class="btn btn-ghost" type="submit" data-mode="register">Register</button>
          </div>
        </form>
        <p id="home-login-msg" class="muted"></p>
      </section>

      <section class="card quick-links-card">
        <h2>Quick Actions</h2>
        <div class="stack">
          <a class="btn" href="/punters.html">Go to Punters Area</a>
          <a class="btn btn-ghost" href="/admin.html">Go to Admin Area</a>
        </div>
      </section>
    </main>

    <footer class="wrap footer muted">
      <p>Punters only? Use the login above. Admin tools are available here:</p>
      <p><a class="menu-link" href="/admin.html">Open Admin Area</a></p>
    </footer>

    <script src="home-login.js"></script>
  </body>
</html>
