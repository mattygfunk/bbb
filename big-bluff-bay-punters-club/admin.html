<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Area • Big Bluff Bay</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero"><div class="overlay"></div><nav class="nav wrap"><a class="brand" href="/punters/" style="text-decoration:none;color:inherit;"><span class="badge">BBB</span><span><strong>Admin Area</strong><small>Big Bluff Bay</small></span></a><div class="menu-links"><a class="menu-link" href="/punters/">Home</a><a class="menu-link" href="/punters/punters.html">Punters</a><a class="menu-link active" href="/punters/admin.html">Admin</a></div><div id="auth-controls"></div></nav></header>
    <main class="wrap">
      <section class="card" id="admin-login-card"><h2>Admin Login</h2>
        <form id="login-form" class="stack">
          <label>Admin user <input required name="member" type="text" value="admin" /></label>
          <label>Password <input required name="pin" type="password" /></label>
          <button class="btn" type="submit" data-mode="login">Log In</button>
        </form>
        <p id="login-msg" class="muted"></p>
      </section>
      <div id="admin-only" style="display:none">
        <section class="card"><h2>Edit Next Meet</h2>
          <form id="fixture-form" class="stack">
            <label>Date & Time <input name="date" type="text" placeholder="Sat 14 Feb, 3:19 PM" /></label>
            <label>Event <input name="event" type="text" placeholder="Next Meet" /></label>
            <label>Track <input name="track" type="text" placeholder="Pinjarra" /></label>
            <label>Number of races <input name="raceCount" type="number" min="1" max="24" value="12" /></label>
            <button class="btn" type="submit">Update Fixture</button>
          </form>
          <p id="fixture-msg" class="muted"></p>
        </section>
        <section class="card"><h2>Enter Official Results</h2>
          <form id="results-form" class="stack">
            <label>Race <select name="race" id="results-race"></select></label>
            <label>1st (supports dead heats; comma-separated)
              <input name="first" type="text" placeholder="e.g. 4,7" />
            </label>
            <label>2nd (comma-separated)
              <input name="second" type="text" placeholder="e.g. 2" />
            </label>
            <label>3rd (comma-separated)
              <input name="third" type="text" placeholder="e.g. 9" />
            </label>
            <label>Scratchings substitutes (scratched>substitute, comma-separated)
              <input name="substitutions" type="text" placeholder="e.g. 5>12, 8>3" />
            </label>
            <button class="btn" type="submit">Save Results</button>
          </form>
          <p id="results-msg" class="muted"></p>
        </section>
        <section class="card"><h2>Bosses Bet (Place Multi)</h2>
          <form id="bosses-form" class="stack">
            <p class="muted">Defaults to all races at the meet. Untick any legs you don’t want in this week’s multi.</p>
            <div id="bosses-legs" class="stack"></div>
            <button class="btn" type="submit">Save Bosses Bet</button>
          </form>
          <p id="bosses-msg" class="muted"></p>
        </section>
        <section class="card"><h2>Users Who Have Tipped</h2><div id="admin-list" class="stack"></div></section>
      </div>
    </main>
    <script src="admin.js"></script>
  </body>
</html>
