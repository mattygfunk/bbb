<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Private Club Alerts • Big Bluff Bay</title>
    <meta name="description" content="Private Club Alerts for high-signal tournament notifications." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root{
        --bg-a:#050706;
        --bg-b:#072216;
        --text:#f5f5f0;
        --muted:#c8c8bc;
        --gold:#d4af37;
        --gold-soft:#a9872c;
        --glass:rgba(10,16,13,.55);
        --line:rgba(212,175,55,.55);
      }
      *{box-sizing:border-box}
      html,body{margin:0;padding:0}
      body{
        font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
        color:var(--text);
        background:
          radial-gradient(circle at 25% 20%, rgba(212,175,55,.06), transparent 32%),
          radial-gradient(circle at 75% 75%, rgba(39,103,73,.18), transparent 35%),
          repeating-linear-gradient(45deg, rgba(255,255,255,.015) 0 2px, transparent 2px 6px),
          linear-gradient(160deg,var(--bg-a),var(--bg-b));
        min-height:100vh;
      }
      .wrap{max-width:680px;margin:0 auto;padding:24px}
      .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
      .top a{color:#e6dbc0;text-decoration:none;font-size:.9rem}
      .hero{margin:24px 0}
      h1{margin:0;font-size:clamp(1.7rem,4.8vw,2.4rem);letter-spacing:.06em}
      .sub{margin-top:24px;color:var(--muted);line-height:1.5}

      .card{
        background:var(--glass);
        backdrop-filter: blur(8px);
        border:1px solid var(--line);
        border-radius:14px;
        padding:24px;
        box-shadow:0 8px 30px rgba(0,0,0,.28);
      }
      .stack{display:grid;gap:24px}
      label{display:grid;gap:8px;font-size:.92rem;color:#efe5c8}
      input[type="email"],input[type="tel"]{
        width:100%;padding:12px 13px;border-radius:9px;
        border:1px solid rgba(212,175,55,.35);background:rgba(0,0,0,.28);color:var(--text);
      }
      .checks{display:grid;grid-template-columns:1fr;gap:12px}
      .check{
        display:flex;gap:10px;align-items:flex-start;
        border:1px solid rgba(212,175,55,.2);border-radius:10px;padding:10px 12px;background:rgba(0,0,0,.15);
      }
      .check input{margin-top:2px;accent-color:#d4af37}
      .cta{
        appearance:none;border:1px solid var(--gold-soft);border-radius:10px;
        background:linear-gradient(180deg,#e7c55a,#c89f2a);color:#15120a;
        font-weight:800;letter-spacing:.04em;padding:13px 16px;cursor:pointer;
        transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
      }
      .cta:hover{transform:translateY(-1px);box-shadow:0 10px 20px rgba(212,175,55,.18);filter:saturate(1.08)}
      .cta:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
      .privacy{font-size:.82rem;color:#cbbf9d}
      .status{min-height:1.2em;color:#cabf9b;font-size:.9rem}

      .proof{margin-top:24px;padding:18px;border:1px solid rgba(212,175,55,.35);border-radius:12px;background:rgba(0,0,0,.22)}
      .proof h2{margin:0 0 24px;font-size:1rem;color:#ead9aa;letter-spacing:.03em}
      .proof-grid{display:grid;grid-template-columns:1fr;gap:12px}
      .pill{border:1px solid rgba(212,175,55,.25);border-radius:999px;padding:10px 12px;color:#dfd3b4;font-size:.9rem;text-align:center;background:rgba(6,10,8,.4)}

      @media (min-width:640px){.checks{grid-template-columns:1fr 1fr}.proof-grid{grid-template-columns:repeat(3,1fr)}}
    </style>
  </head>
  <body>
    <main class="wrap">
      <header class="top">
        <a href="/">← Home</a>
        <a href="/poker-schedule.html">Poker Tournaments</a>
      </header>

      <section class="hero">
        <h1>PRIVATE CLUB ALERTS</h1>
        <p class="sub">Stay ahead of overlays. Know before late reg closes. Get the edge.</p>
      </section>

      <section class="card">
        <form id="alerts-form" class="stack" novalidate>
          <label>
            Email
            <input id="email" type="email" placeholder="you@domain.com" autocomplete="email" required />
          </label>

          <label>
            Mobile (optional)
            <input id="mobile" type="tel" placeholder="04xx xxx xxx" autocomplete="tel" />
          </label>

          <div class="checks" aria-label="Alert types">
            <label class="check"><input type="checkbox" name="overlayWatch" checked /><span>Overlay risk detected</span></label>
            <label class="check"><input type="checkbox" name="lateReg" checked /><span>Late reg closing (15m)</span></label>
            <label class="check"><input type="checkbox" name="startingSoon" checked /><span>Starting soon (30m)</span></label>
            <label class="check"><input type="checkbox" name="freerolls" checked /><span>Freeroll posted</span></label>
            <label class="check"><input type="checkbox" name="cashActive" /><span>Cash tables active</span></label>
          </div>

          <button id="activate" class="cta" type="submit">ACTIVATE ALERTS</button>
          <p class="privacy">Private by default. Condition-based sends only. Unsubscribe anytime.</p>
          <p id="status" class="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="proof" aria-label="Social proof">
        <h2>Operator Signal</h2>
        <div class="proof-grid">
          <div class="pill">No duplicate alerts</div>
          <div class="pill">Melbourne-time scheduling</div>
          <div class="pill">Verified-contact delivery</div>
        </div>
      </section>
    </main>

    <script src="alerts.js"></script>
  </body>
</html>
