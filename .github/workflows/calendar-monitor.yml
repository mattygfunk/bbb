name: Poker calendar source monitor

on:
  workflow_dispatch:
  schedule:
    # Daily at 06:15 Melbourne time during daylight saving (UTC schedule).
    - cron: '15 19 * * *'

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bbb
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check event dates and organiser sources
        run: node scripts/check-events.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Rebuild event pages, profiles, feeds and sitemap
        run: node scripts/build-directory-pages.mjs
      - name: Commit generated pages when they change
        run: |
          git add events organisers venues cities/gold-coast.html cities/cairns.html tournaments.html organisers.html venues.html updates.html events.xml events.ics sitemap.xml
          if git diff --cached --quiet; then
            echo "Generated pages are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh generated poker event directories"
          git push origin bbb
